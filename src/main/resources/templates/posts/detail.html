<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿詳細 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>投稿詳細</h1>
    <nav style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
        <a th:href="@{/posts}">一覧に戻る</a>
        <a th:href="@{/posts/trash}" class="btn" style="background: var(--color-bg-card); color: var(--color-text-main); border: 1px solid rgba(0, 0, 0, 0.15); box-shadow: none; display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.4rem 1rem; font-size: 0.9rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
            </svg>
            <span>ごみ箱</span>
        </a>
    </nav>

    <!-- グラスモルフィズムのコンテナとして詳細カードを表現します -->
    <div class="glass-panel">
        <article class="post-detail">
            <header style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
                <!-- DBに保存されたRGBカラーを背景色として適用し、投稿者のイニシャル（先頭1文字）を表示します -->
                <span class="post__avatar" 
                      th:style="'background-color: ' + ${post.color} + ';'" 
                      th:text="${#strings.substring(post.author, 0, 1)}">A</span>
                <!-- ControllerがModelへ格納したpostから投稿者名をHTMLエスケープして表示する。 -->
                <span class="post__author" th:text="${post.author}" style="font-size: 1.1rem;">投稿者</span>
            </header>
            
            <!-- 投稿本文は改行と長い文字列の折り返しをCSSで扱い、th:textで安全に表示する。 -->
            <p class="post__body" th:text="${post.body}" style="font-size: 1.1rem; line-height: 1.7; margin-bottom: 1rem;">本文</p>

            <!-- 投稿に紐付いているタグを一覧表示します -->
            <div class="post__tags" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; margin-bottom: 1rem;">
                <div class="post__tag" th:each="tag : ${post.tags}" style="background: rgba(79, 70, 229, 0.1); color: var(--color-accent-start); border-radius: 20px; padding: 0.25rem 0.75rem; font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.35rem;">
                    <!-- タグ名をクリックすると、そのタグの投稿一覧（/tags/{name}）へ遷移します -->
                    <a th:href="@{/tags/{name}(name=${tag.name})}" th:text="'#' + ${tag.name}" style="color: inherit; text-decoration: none;">#java</a>
                    <!-- タグの関連付けを解除する削除フォーム -->
                    <form th:action="@{/posts/{postId}/tags/{tagId}/delete(postId=${post.id}, tagId=${tag.id})}" method="post" style="display: inline-flex; align-items: center;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" style="background: none; border: none; color: var(--color-text-muted); cursor: pointer; padding: 0; font-size: 0.95rem; line-height: 1; transition: var(--transition-smooth); display: flex; align-items: center; justify-content: center;" onmouseover="this.style.color='#EF4444'" onmouseout="this.style.color='var(--color-text-muted)'">
                            <span style="font-family: sans-serif; font-size: 0.9rem;">&times;</span>
                        </button>
                    </form>
                </div>
            </div>

            <footer class="post__footer">
                <!-- 投稿日をdatetime属性には元値、画面表示には読みやすい形式で出力する。 -->
                <time class="post__created-at"
                      th:datetime="${post.createdAt}"
                      th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
            </footer>
        </article>

        <!-- いいね機能および削除アクションのセクション。美しくレイアウト調整します -->
        <section class="likes" style="display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(0, 0, 0, 0.06);">
            <!-- いいねボタンと現在のカウント -->
            <div style="display: flex; align-items: center; gap: 1rem;">
                <span style="font-size: 0.95rem; color: var(--color-text-muted);">いいね <span th:text="${likeCount}" style="font-weight: 600; color: #EC4899;">0</span> 件</span>
                <form th:action="@{/posts/{id}/likes(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn" style="padding: 0.4rem 1.2rem; font-size: 0.9rem;">Like</button>
                </form>
            </div>
            <!-- インライン削除確認エリア。初期状態は削除ボタンのみ、クリックで確認表示に切り替えます -->
            <div id="delete-action-container">
                <div id="delete-initial-area">
                    <button type="button" class="btn" onclick="showDeleteConfirm()" style="background: linear-gradient(135deg, #EF4444, #DC2626); color: #ffffff; padding: 0.4rem 1.2rem; font-size: 0.9rem; border: none; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);">削除する</button>
                </div>

                <div id="delete-confirm-area" style="display: none; align-items: center; gap: 0.75rem; background: rgba(239, 68, 68, 0.05); padding: 0.4rem 0.8rem; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.15);">
                    <span style="font-size: 0.85rem; color: #DC2626; font-weight: 600;">本当に削除しますか？</span>
                    <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline-flex; gap: 0.4rem; margin: 0;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn" style="background: #DC2626; color: #ffffff; padding: 0.35rem 0.9rem; font-size: 0.8rem; border: none;">はい</button>
                        <button type="button" class="btn" onclick="hideDeleteConfirm()" style="background: #F3F4F6; color: #374151; padding: 0.35rem 0.9rem; font-size: 0.8rem; border: 1px solid #D1D5DB;">いいえ</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- 表示切り替え用のインラインスクリプト -->
        <script>
            function showDeleteConfirm() {
                document.getElementById('delete-initial-area').style.display = 'none';
                document.getElementById('delete-confirm-area').style.display = 'flex';
            }
            function hideDeleteConfirm() {
                document.getElementById('delete-initial-area').style.display = 'block';
                document.getElementById('delete-confirm-area').style.display = 'none';
            }
        </script>
    </div>
</main>
</body>
</html>
