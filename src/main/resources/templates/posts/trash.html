<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ごみ箱 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>ごみ箱</h1>
    
    <nav style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
        <a th:href="@{/posts}" class="btn" style="background: var(--color-bg-card); color: var(--color-text-main); border: 1px solid rgba(0, 0, 0, 0.15); box-shadow: none;">タイムラインに戻る</a>
        
        <!-- ごみ箱を空にするフォーム（投稿が存在する場合のみ表示） -->
        <form th:if="${not #lists.isEmpty(posts)}" th:action="@{/posts/trash/empty}" method="post" onsubmit="return confirm('ごみ箱を空にしてもよろしいですか？（完全に非表示になります）');" style="margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn" style="background: linear-gradient(135deg, #EF4444, #DC2626); color: #ffffff; border: none; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2); display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.5rem 1.2rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
                    <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
                </svg>
                <span>ごみ箱を空にする</span>
            </button>
        </form>
    </nav>

    <!-- 削除済み投稿カード一覧 -->
    <section class="post-list">
        <p class="glass-panel empty-message" th:if="${#lists.isEmpty(posts)}">
            ごみ箱は空です。
        </p>

        <article class="post glass-panel" th:each="post : ${posts}" style="cursor: default;">
            <header>
                <!-- アバター表示 -->
                <span class="post__avatar" 
                      th:style="'background-color: ' + ${post.color} + ';'" 
                      th:text="${#strings.substring(post.author, 0, 1)}">A</span>
                <span class="post__author" th:text="${post.author}">投稿者</span>
            </header>
            <p class="post__body" th:text="${post.body}">本文</p>

            <!-- タグ表示（テキストのみ） -->
            <div class="post__tags" style="display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem;">
                <span class="post__tag" th:each="tag : ${post.tags}" style="background: rgba(79, 70, 229, 0.08); color: var(--color-accent-start); border-radius: 20px; padding: 0.15rem 0.6rem; font-size: 0.8rem; font-weight: 500;">
                    <span th:text="'#' + ${tag.name}">#java</span>
                </span>
            </div>

            <!-- フッターに削除日時表示と「元に戻す」ボタンを配置 -->
            <footer class="post__footer" style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(0,0,0,0.03); padding-top: 0.5rem; margin-top: 0.5rem;">
                <div style="font-size: 0.85rem; color: var(--color-text-muted);">
                    <span>削除日: </span>
                    <time th:datetime="${post.deletedAt}"
                          th:text="${#temporals.format(post.deletedAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
                </div>
                
                <!-- 復元フォーム -->
                <form th:action="@{/posts/{id}/restore(id=${post.id})}" method="post" style="margin: 0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn" style="background: var(--color-accent-start); color: #ffffff; padding: 0.3rem 0.9rem; font-size: 0.8rem; border: none; box-shadow: none;">元に戻す</button>
                </form>
            </footer>
        </article>
    </section>
</main>
</body>
</html>
