<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿一覧 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>社内つぶやきボード</h1>
    <nav style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
        <div style="display: flex; gap: 1rem;">
            <a th:href="@{/posts}">一覧</a>
            <a th:href="@{/posts/new}">新規投稿</a>
        </div>
        <!-- ごみ箱リンク（セカンダリボタンスタイル） -->
        <a th:href="@{/posts/trash}" class="btn" style="background: var(--color-bg-card); color: var(--color-text-main); border: 1px solid rgba(0, 0, 0, 0.15); box-shadow: none; display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.4rem 1rem; font-size: 0.9rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
            </svg>
            <span>ごみ箱</span>
        </a>
    </nav>

    <!-- 検索キーワード入力用のフォーム。GETリクエストで/postsに送信します -->
    <form class="search-form" method="get" th:action="@{/posts}">
        <!-- th:valueを用いて検索キーワードをテキストボックスに再表示（リテイン）します -->
        <input type="text" name="q" th:value="${q}" placeholder="キーワードで検索...">
        <button type="submit" class="btn btn-primary">検索</button>
    </form>

    <!-- タイムラインの更新ツールバー -->
    <form class="toolbar" method="get" th:action="@{/posts}">
        <button type="submit">タイムラインを更新</button>
    </form>

    <!-- 投稿カード一覧セクション -->
    <section class="post-list">
        <!-- キーワードが指定されているが、検索結果が0件の場合のメッセージ -->
        <p class="glass-panel empty-message" th:if="${#lists.isEmpty(posts) and q != null and !q.strip().isEmpty()}">
            該当する投稿は見つかりませんでした。別のキーワードでお試しください。
        </p>
        <!-- キーワードが空、またはスペースのみで投稿が全く存在しない場合のメッセージ -->
        <p class="glass-panel empty-message" th:if="${#lists.isEmpty(posts) and (q == null or q.strip().isEmpty())}">
            まだ投稿はありません。最初の一言を投稿しよう。
        </p>

        <!-- 各投稿を表示するループ処理。投稿全体をクリック可能にするためaタグで囲み、グラスモルフィズムのスタイルをあてます -->
        <article class="post glass-panel" th:each="post : ${posts}">
            <!-- 詳細画面（/posts/{id}）へのリンク。枠全体に広げるため block 要素に指定しています -->
            <a th:href="@{/posts/{id}(id=${post.id})}" style="text-decoration: none; color: inherit; display: block;">
                <header>
                    <!-- DBに保存されたRGBカラーを背景色として適用し、投稿者のイニシャル（先頭1文字）を表示します -->
                    <span class="post__avatar" 
                          th:style="'background-color: ' + ${post.color} + ';'" 
                          th:text="${#strings.substring(post.author, 0, 1)}">A</span>
                    <span class="post__author" th:text="${post.author}">投稿者</span>
                </header>
                <p class="post__body" th:text="${post.body}">本文</p>

                <!-- 投稿に紐付いているタグを一覧表示します（外枠が詳細リンクのaタグのため、ネストを避けてテキスト表示のみとします） -->
                <div class="post__tags" style="display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem;">
                    <span class="post__tag" th:each="tag : ${post.tags}" style="background: rgba(79, 70, 229, 0.08); color: var(--color-accent-start); border-radius: 20px; padding: 0.15rem 0.6rem; font-size: 0.8rem; font-weight: 500;">
                        <span th:text="'#' + ${tag.name}">#java</span>
                    </span>
                </div>

                <footer class="post__footer">
                    <time class="post__created-at"
                          th:datetime="${post.createdAt}"
                          th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
                    <!-- 各投稿に紐づくいいね数をハートマークと共に表示します。イニシャルと同様にOutfitフォントで表現します。 -->
                    <span class="post__likes" style="color: #EC4899; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.25rem; font-family: 'Outfit', sans-serif; font-weight: 600;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-heart-fill" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314"/>
                        </svg>
                        <span th:text="${likeCounts[post.id]}">0</span>
                    </span>
                </footer>
            </a>
        </article>
    </section>
</main>
</body>
</html>
