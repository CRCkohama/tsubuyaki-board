<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'#' + ${tagName} + ' の投稿一覧 - 社内つぶやきボード'">タグ別投稿一覧</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1 th:text="'#' + ${tagName} + ' の投稿一覧'">#tag の投稿一覧</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
        <a th:href="@{/posts/new}">新規投稿</a>
    </nav>

    <!-- 投稿カード一覧セクション -->
    <section class="post-list">
        <!-- 投稿が存在しない場合のメッセージ -->
        <p class="glass-panel empty-message" th:if="${#lists.isEmpty(posts)}">
            このタグに関連付けられた投稿はまだありません。
        </p>

        <!-- 各投稿を表示するループ処理。投稿全体をクリック可能にするためaタグで囲みます -->
        <article class="post glass-panel" th:each="post : ${posts}">
            <!-- 詳細画面（/posts/{id}）へのリンク。枠全体に広げるため block 要素に指定しています -->
            <a th:href="@{/posts/{id}(id=${post.id})}" style="text-decoration: none; color: inherit; display: block;">
                <header>
                    <!-- DBに保存されたRGBカラーを背景色として適用し、投稿者のイニシャル（先頭1文字）を表示します -->
                    <span class="post__avatar" 
                          th:style="'background-color: ' + ${post.color} + ';'" 
                          th:text="${#strings.substring(post.author, 0, 1)}">A</span>
                    <span class="post__author" th:text="${post.author}">投稿者</span>
                </header>
                <p class="post__body" th:text="${post.body}">本文</p>

                <!-- 投稿に紐付いているタグを一覧表示します -->
                <div class="post__tags" style="display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem;">
                    <span class="post__tag" th:each="tag : ${post.tags}" style="background: rgba(79, 70, 229, 0.08); color: var(--color-accent-start); border-radius: 20px; padding: 0.15rem 0.6rem; font-size: 0.8rem; font-weight: 500;">
                        <span th:text="'#' + ${tag.name}">#java</span>
                    </span>
                </div>

                <footer class="post__footer">
                    <time class="post__created-at"
                          th:datetime="${post.createdAt}"
                          th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
                    <!-- 各投稿に紐づくいいね数をハートマークと共に表示します -->
                    <span class="post__likes" style="color: #EC4899; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.25rem; font-family: 'Outfit', sans-serif; font-weight: 600;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-heart-fill" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314"/>
                        </svg>
                        <span th:text="${likeCounts[post.id]}">0</span>
                    </span>
                </footer>
            </a>
        </article>
    </section>
</main>
</body>
</html>
